name: Site Build and Deploy

on:
  pull_request:
  push:
    branches: [main]
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototypes/docusaurus/package-lock.json

      - name: Sync docs
        run: npm run sync:docs
        env:
          REACT_ON_DJANGO_REPO_URL: ${{ github.event.client_payload.repo_url || 'https://github.com/shakacode/react-on-django.git' }}
          REACT_ON_DJANGO_REF: ${{ github.event.client_payload.ref || 'main' }}

      - name: Prepare docs
        run: npm run prepare:docs

      - name: Audit docs
        id: audit_docs
        continue-on-error: true
        run: npm run audit:docs -- --output VALIDATION_REPORT_CI.md --fail-on error

      - name: Upload docs audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-audit-report
          path: VALIDATION_REPORT_CI.md
          if-no-files-found: error

      - name: Add docs audit summary
        if: always()
        run: |
          {
            echo "### Docs Audit"
            echo ""
            grep -E '^(Pages scanned|Pages with findings|Pages with errors|Pages with warnings|Pages with info|Errors|Warnings|Info):' VALIDATION_REPORT_CI.md || true
            echo ""
            echo "- Artifact: \`docs-audit-report\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on blocking docs audit findings
        if: steps.audit_docs.outcome == 'failure'
        run: exit 1

      - name: Validate docs scripts
        run: npm run test:docs

      - name: Install site dependencies
        run: npm run install:site

      - name: Build site
        run: npm run build

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: workers-deploy
      url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototypes/docusaurus/package-lock.json

      - name: Sync docs
        run: npm run sync:docs
        env:
          REACT_ON_DJANGO_REPO_URL: ${{ github.event.client_payload.repo_url || 'https://github.com/shakacode/react-on-django.git' }}
          REACT_ON_DJANGO_REF: ${{ github.event.client_payload.ref || 'main' }}

      - name: Prepare docs
        run: npm run prepare:docs

      - name: Validate docs scripts
        run: npm run test:docs

      - name: Install site dependencies
        run: npm run install:site

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Workers
        id: deploy
        run: |
          set -euo pipefail
          npm run deploy | tee /tmp/wrangler-workers-deploy.log
          DEPLOYMENT_URL="https://react-on-django.com"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Cloudflare Workers Deployment"
            echo ""
            echo "- Ref: \`${{ github.ref_name }}\`"
            echo "- URL: $DEPLOYMENT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
